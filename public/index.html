<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clickety-Clack: the English train quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Overpass:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Clickety-Clack · design: vintage railway poster + station signage + departure boards */
:root{
 --bg:#f1e8d4;--bg2:#e6d9bc;--card:#fffaee;--ink:#15261f;--mute:#5d6a60;--line:#d8caa9;--edge:#15261f;
 --green:#1d5a43;--on-green:#f7efda;--brass:#e8a631;--on-brass:#15261f;--red:#c2412d;
 --good:#2b8a55;--mid:#c98510;--bad:#c2412d;--acc:#c2412d;
 --board:#17140f;--amber:#ffb53d;--amber-dim:#8a6a33;
 --sky:#cfe3dc;--hill1:#9cc3a0;--hill2:#6fa281;--sun:#f2b63c;
 --lG:#7a52c0;--lV:#d6802a;--lE:#16907c;--lW:#2f6bd3;
 --fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Overpass","Trebuchet MS",system-ui,sans-serif;--fm:"Space Mono",ui-monospace,Menlo,monospace;
 --sh:5px 5px 0 var(--edge);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0d1714;--bg2:#13211c;--card:#16241f;--ink:#efe6d1;--mute:#a4ae9f;--line:#2c3d35;--edge:#060d0a;
 --green:#246a50;--on-green:#f7efda;--brass:#f0b444;--on-brass:#15261f;--red:#ff7a5e;
 --good:#4fc184;--mid:#f0b444;--bad:#ff7a6a;--acc:#ff7a5e;--board:#0a0a07;
 --sky:#183a33;--hill1:#285446;--hill2:#1d4337;--sun:#f0c45a;--lG:#a585e6;--lV:#f0a04a;--lE:#3cc2a8;--lW:#6b9cf0;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0d1714;--bg2:#13211c;--card:#16241f;--ink:#efe6d1;--mute:#a4ae9f;--line:#2c3d35;--edge:#060d0a;
 --green:#246a50;--on-green:#f7efda;--brass:#f0b444;--on-brass:#15261f;--red:#ff7a5e;
 --good:#4fc184;--mid:#f0b444;--bad:#ff7a6a;--acc:#ff7a5e;--board:#0a0a07;
 --sky:#183a33;--hill1:#285446;--hill2:#1d4337;--sun:#f0c45a;--lG:#a585e6;--lV:#f0a04a;--lE:#3cc2a8;--lW:#6b9cf0;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;color:var(--ink);font:400 18px/1.55 var(--fb);background-color:var(--bg);
 background-image:linear-gradient(var(--bg2) 0 0),repeating-linear-gradient(90deg,transparent 0 46px,color-mix(in srgb,var(--line) 45%,transparent) 46px 48px);
 background-size:100% 8px,100% 8px;background-repeat:no-repeat,repeat-x;background-position:0 0,0 8px}
main{max-width:880px;margin:0 auto;padding:30px 20px 60px}
h1,h2,h3{font-family:var(--fd);text-transform:uppercase;letter-spacing:.01em;line-height:.95}
h1{font-weight:900;font-size:clamp(2.6rem,7.5vw,4.4rem);margin:.15em 0 .15em}
h2{font-weight:800;font-size:1.75rem;margin:.1em 0 .45em}
h3{font-weight:800;font-size:1.35rem;margin:16px 0 6px}
p{margin:.45em 0}
a{color:inherit}
.mute{color:var(--mute);font-size:.94rem}
.section-kicker,.eyebrow{font:700 .74rem/1.3 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.card{background:var(--card);border:2px solid var(--edge);border-radius:8px;box-shadow:var(--sh);padding:20px;margin:22px 0;animation:rise .35s both}
.card h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{font:700 1rem/1.2 var(--fb);cursor:pointer;color:var(--ink);background:var(--card);border:2px solid var(--edge);border-radius:6px;padding:10px 16px;min-height:46px;box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s,background .15s}
button:hover:not(:disabled){background:color-mix(in srgb,var(--brass) 14%,var(--card))}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
button.main{background:var(--brass);color:var(--on-brass)}
button.main:hover:not(:disabled){background:color-mix(in srgb,var(--brass) 88%,#fff)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:3px}
input,select,textarea{font:500 1.08rem var(--fb);width:100%;padding:10px 12px;min-height:46px;border:2px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink)}
label{font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{padding:8px 12px;min-height:42px}
.lis{min-height:34px;padding:0 9px;font-size:1rem;vertical-align:middle;margin-left:6px;box-shadow:2px 2px 0 var(--edge)}
.sndw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:12px;z-index:6}
.snd{min-width:46px;padding:2px 10px;border-radius:50%}
/* Volume panel: opens when the pointer is over the sound button (or it has keyboard focus) */
.sndpop{position:absolute;top:100%;right:0;margin-top:12px;width:230px;padding:12px 14px 8px;background:var(--card);border:2px solid var(--edge);border-radius:8px;box-shadow:4px 4px 0 var(--edge);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .15s,transform .15s,visibility 0s .15s}
.sndpop:before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px}
.sndpop:after{content:"";position:absolute;top:-9px;right:16px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--edge);border-top:2px solid var(--edge);transform:rotate(45deg)}
.sndw:hover .sndpop,.sndw:focus-within .sndpop{opacity:1;visibility:visible;transform:none;transition:opacity .15s,transform .15s}
.sndpop label{display:flex;justify-content:space-between;align-items:baseline;font:700 .74rem var(--fm);letter-spacing:.12em;text-transform:uppercase}
.sndpop output{font:700 1.1rem var(--fm);color:var(--green);letter-spacing:0}
.sndpop input{display:block;width:100%}
.sndpop .chip{width:100%;min-height:36px;margin:4px 0 6px;padding:4px 10px;font-size:.88rem;box-shadow:2px 2px 0 var(--edge)}
.lv{display:inline-block;font:700 .78rem/1.5 var(--fm);background:var(--green);color:var(--on-green);border-radius:4px;padding:0 7px;margin-right:6px;vertical-align:2px}
summary{cursor:pointer;font:800 1.3rem var(--fd);text-transform:uppercase}
ul{padding-left:1.2em;margin:.4em 0}li{margin:.3em 0}ol{padding-left:1.3em}

/* --- The locomotive (inline SVG) --- */
.loco{display:block;width:64px;height:34px;overflow:visible}
.loco .lb{stroke:var(--edge);stroke-width:2;stroke-linejoin:round}

/* --- Masthead: enamel station sign --- */
.masthead{position:relative;margin:10px 0 26px;padding:26px 28px 70px;background:var(--green);color:var(--on-green);border:2px solid var(--edge);border-radius:12px;box-shadow:var(--sh),inset 0 0 0 6px var(--green),inset 0 0 0 8px var(--brass);overflow:hidden}
.masthead h1{color:var(--on-green);font-size:clamp(3rem,10vw,5.6rem);margin:.08em 0 .1em;text-shadow:3px 3px 0 color-mix(in srgb,#000 35%,transparent)}
.masthead .eyebrow{color:var(--brass)}
.masthead .subtitle{font-size:1.1rem;max-width:34em;opacity:.92}
.mast-rail{position:absolute;left:8px;right:8px;bottom:12px;height:44px;border-bottom:4px solid var(--brass)}
.mast-rail:before{content:"";position:absolute;left:0;right:0;bottom:-10px;height:6px;background:repeating-linear-gradient(90deg,var(--brass) 0 4px,transparent 4px 18px);opacity:.7}
.mast-train{position:absolute;bottom:0;left:-40%;display:flex;align-items:flex-end;gap:3px;animation:runby 14s linear infinite}
.mast-train i{position:relative;display:block;width:46px;height:24px;border:2px solid var(--edge);border-radius:4px 4px 2px 2px;background:var(--brass);margin-bottom:5px}
.mast-train i:after{content:"";position:absolute;left:5px;right:5px;bottom:-8px;height:6px;background:radial-gradient(circle,var(--edge) 0 2.6px,transparent 3px) 0 0/16px 6px repeat-x}
@keyframes runby{to{left:105%}}

/* --- Topic icons and labels (topic picker) --- */
.topic-icon{flex:none;width:52px;height:52px;border-radius:50%;background:var(--topic);color:#fff;border:3px solid var(--edge);display:grid;place-items:center;font:900 1.7rem/1 var(--fd);box-shadow:inset 0 0 0 3px color-mix(in srgb,#fff 35%,transparent)}
.sub-count{flex:none;font:400 .72rem var(--fm);color:var(--mute);white-space:nowrap}
.subhead{position:relative;font:700 .7rem var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px -30px;padding-left:30px}
.subhead:first-child{margin-top:0}
.details-card{background:color-mix(in srgb,var(--bg2) 50%,var(--card))}
.unit-pick{display:inline-flex;border:2px solid var(--edge);border-radius:6px;overflow:hidden;box-shadow:3px 3px 0 var(--edge)}
.unit-pick button{border:0;border-radius:0;box-shadow:none;min-height:40px;padding:6px 14px}
.unit-pick button+button{border-left:2px solid var(--edge)}
.unit-pick button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}

/* --- Question ticket --- */
.ticket{position:relative}
.ticket h2{font:700 1.45rem/1.3 var(--fb);text-transform:none;letter-spacing:0;padding-bottom:14px;margin-bottom:14px;border-bottom:2px dashed var(--line)}
.bar{height:12px;border:2px solid var(--edge);border-radius:3px;background:var(--card);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(-45deg,var(--brass) 0 10px,color-mix(in srgb,var(--brass) 75%,var(--edge)) 10px 20px);transition:width .1s linear}
.opts{display:grid;gap:10px;margin:12px 0;counter-reset:o}
.opts button{display:flex;align-items:center;gap:14px;text-align:left;padding:10px 14px 10px 10px;font-size:1.06rem;font-weight:600}
.opts button:before{counter-increment:o;content:counter(o);flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:4px;background:var(--green);color:var(--on-green);font:900 1.3rem/1 var(--fd)}
.opts button.on{background:var(--brass);color:var(--on-brass)}
.opts button.ok{background:var(--good);color:#fff}.opts button.no{background:var(--bad);color:#fff}
.opts button:disabled{opacity:1}.opts button:disabled:not(.ok):not(.no){opacity:.5}
.opts button.ok{animation:pop .4s}
.slot{min-height:58px;border:2px dashed var(--edge);border-radius:6px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;background:color-mix(in srgb,var(--bg2) 40%,transparent)}
.fb{border-left:8px solid var(--mid);padding:8px 14px;margin:14px 0;background:color-mix(in srgb,var(--mid) 12%,var(--card));border-radius:0 6px 6px 0;animation:rise .3s both}
.fb.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}.fb.none{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.fs{font-weight:700;color:var(--good)}
.tip{background:var(--card);border:2px dashed var(--edge);border-radius:6px;padding:9px 13px;margin:10px 0;font-size:.95rem}

/* --- Route strip (solo journey) --- */
.track{position:relative;height:96px;margin:16px 0 6px;border:2px solid var(--edge);border-radius:8px;overflow:visible;box-shadow:3px 3px 0 var(--edge)}
.track .scene{position:absolute;inset:0;border-radius:6px;background:
 radial-gradient(circle at 88% 28%,var(--sun) 0 11px,transparent 12px),
 radial-gradient(70% 90% at 15% 140%,var(--hill1) 0 60%,transparent 61%),
 radial-gradient(60% 80% at 62% 150%,var(--hill2) 0 60%,transparent 61%),
 radial-gradient(70% 90% at 98% 140%,var(--hill1) 0 58%,transparent 59%),
 linear-gradient(var(--sky),color-mix(in srgb,var(--sky) 50%,var(--card)))}
.track:before{content:"";position:absolute;left:6px;right:6px;bottom:16px;height:6px;z-index:1;background:repeating-linear-gradient(90deg,var(--edge) 0 3px,transparent 3px 11px)}
.track:after{content:"";position:absolute;left:6px;right:6px;bottom:21px;height:3px;background:var(--edge);z-index:1}
.track .stn{position:absolute;bottom:14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:3px solid var(--edge);z-index:2}
.track b{position:absolute;bottom:22px;z-index:3;transform:translateX(-50%);transition:left .9s cubic-bezier(.45,.05,.3,1)}
.track b.run .loco{animation:chug .2s infinite}
@keyframes chug{50%{transform:translateY(-2px)}}
.puff{position:absolute;bottom:62px;z-index:4;width:10px;height:10px;margin-left:8px;border-radius:50%;background:color-mix(in srgb,var(--card) 70%,var(--mute));pointer-events:none;animation:puff .9s ease-out forwards}
@keyframes puff{from{transform:translate(0,0) scale(.4);opacity:.85}to{transform:translate(-18px,-24px) scale(1.7);opacity:0}}
.ends{display:flex;justify-content:space-between;font:700 .76rem var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.train{display:flex;gap:4px;align-items:flex-end;margin:12px 0 18px;flex-wrap:wrap}
.train .loco{width:56px;height:30px}
.cx{position:relative;width:36px;height:24px;margin-bottom:5px;border:2px solid var(--edge);border-radius:4px 4px 2px 2px;background-size:100% 8px;background-position:0 4px;background-repeat:no-repeat}
.cx.good{background-color:var(--good);background-image:repeating-linear-gradient(90deg,transparent 0 4px,color-mix(in srgb,#fff 80%,transparent) 4px 9px)}
.cx.mid{background-color:var(--mid);background-image:repeating-linear-gradient(90deg,transparent 0 4px,color-mix(in srgb,#fff 80%,transparent) 4px 9px)}
.cx.none{background:transparent;border-style:dashed}
.cx:after{content:"";position:absolute;left:2px;right:2px;bottom:-8px;height:6px;background:radial-gradient(circle,var(--edge) 0 2.6px,transparent 3px) 0 0/16px 6px repeat-x}
.cx.new{animation:couple .45s both}

/* --- Results report --- */
.study{border:2px solid var(--edge);border-left:8px solid var(--green);border-radius:6px;padding:10px 12px;margin:10px 0}.study p{margin:4px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpi{border:2px solid var(--edge);border-radius:6px;padding:10px 6px;text-align:center;background:var(--board);color:var(--amber)}
.kpi b{display:block;font:700 1.9rem/1.1 var(--fm)}
.kpi span{font:400 .72rem var(--fm);text-transform:uppercase;color:var(--amber-dim)}
.report h3{margin:20px 0 6px}
.rt{width:100%;border-collapse:collapse}.rt td{padding:5px 6px}
.pb{display:block;height:12px;min-width:80px;background:var(--line);border-radius:3px;overflow:hidden}.pb i{display:block;height:100%;background:var(--good)}
.qlist{list-style:none;padding:0;margin:0}
.qlist li{border-left:8px solid var(--line);padding:9px 13px;margin:10px 0;background:color-mix(in srgb,var(--bg2) 35%,var(--card));border-radius:0 6px 6px 0}
.qlist li.q-good{border-color:var(--good)}.qlist li.q-mid{border-color:var(--mid)}.qlist li.q-none{border-color:var(--bad)}
.qh{display:flex;gap:8px;font-weight:700}.qa{font-size:.95rem}

/* --- Rooms, lobby, boards --- */
.code{display:inline-flex;gap:5px;vertical-align:middle}
.code i{font:700 .82em/1 var(--fm);font-style:normal;width:1.05em;padding:.12em 0 .08em;text-align:center;background:var(--board);color:var(--amber);border-radius:4px;border:2px solid var(--edge);box-shadow:inset 0 -.5em 0 color-mix(in srgb,#fff 6%,transparent),inset 0 1px 0 color-mix(in srgb,#000 60%,transparent)}
.lobby{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lobby img{background:#fff;padding:8px;border-radius:6px;border:2px solid var(--edge)}
.plist{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px}
.plist li{display:flex;align-items:center;gap:8px;border:2px solid var(--edge);border-radius:6px;padding:4px 10px 4px 6px;background:var(--card);margin:0;animation:rise .3s both}
.plist li.off{opacity:.5}.plist .loco{width:46px;height:24px}
.mb{margin:8px 0}
.brow{display:grid;grid-template-columns:30px 1fr 110px 74px auto;gap:10px;align-items:center;padding:6px 10px;border-radius:4px;font-family:var(--fm);font-size:.92rem;color:var(--amber);background:var(--board);border-bottom:1px solid #2a2418}
.brow:first-child{border-radius:6px 6px 0 0}.brow:last-child{border-radius:0 0 6px 6px;border-bottom:0}
.brow.me{color:var(--board);background:var(--amber)}.brow.off{opacity:.55}
.rk{font-weight:700}.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:8px;background:#2f2a1f;border-radius:2px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--amber)}
.brow.me .pbar{background:color-mix(in srgb,var(--board) 30%,transparent)}.brow.me .pbar i{background:var(--board)}
.mi{text-align:right;font-weight:700}
@media(max-width:480px){.brow{grid-template-columns:24px 1fr 64px 64px}.brow .sq{display:none}}

/* Departure board (live quiz scores and final arrivals) */
.dboard{background:var(--board);color:var(--amber);border:2px solid var(--edge);border-radius:8px;box-shadow:var(--sh);padding:14px 14px 10px;font-family:var(--fm);margin:22px 0}
.dboard h2{font:900 1.6rem/1 var(--fd);color:var(--amber);letter-spacing:.08em;margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dboard h2 small{font:400 .75rem var(--fm);color:var(--amber-dim);letter-spacing:.1em}
.drow{display:grid;grid-template-columns:2.2em 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-top:1px solid #2c2618;font-size:1rem}
.drow .st{font-size:.72rem;color:var(--amber-dim);text-transform:uppercase;letter-spacing:.06em}
.drow b{font-weight:700;text-align:right;white-space:nowrap}
.drow .nm{display:flex;flex-direction:column;min-width:0}
.drow.me{background:var(--amber);color:var(--board);border-radius:4px}.drow.me .st{color:color-mix(in srgb,var(--board) 70%,transparent)}
.drow.top{animation:flap .5s both}
.drow:nth-child(3){animation-delay:.1s}.drow:nth-child(4){animation-delay:.2s}.drow:nth-child(5){animation-delay:.3s}
@keyframes flap{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}

/* --- Live quiz --- */
.qmeta{padding-right:56px}
.pick{--topic:var(--lG);border:2px solid var(--edge);border-radius:6px;margin:0 0 12px;background:var(--card)}
.pick[data-topic="V"]{--topic:var(--lV)}.pick[data-topic="E"]{--topic:var(--lE)}.pick[data-topic="W"]{--topic:var(--lW)}
.pick>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;font:800 1.35rem var(--fd);text-transform:uppercase;border-left:8px solid var(--topic)}
.pick>summary::-webkit-details-marker{display:none}
.pick .topic-icon{width:38px;height:38px;font-size:1.25rem;border-width:2px}
.pk-count{margin-left:auto;font:700 .8rem var(--fm);color:var(--mute)}
.pick>summary:after{content:"";width:9px;height:9px;border-right:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg);transition:transform .2s;margin:0 4px 4px}
.pick[open]>summary:after{transform:rotate(-135deg);margin:4px 4px 0}
.pk-tools{display:flex;gap:8px;padding:4px 12px 0 20px}
.pk-tools .chip{min-height:34px;padding:4px 10px;font-size:.85rem;box-shadow:2px 2px 0 var(--edge)}
.pk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;padding:8px 12px 12px 20px}
.pk-list .subhead{grid-column:1/-1;margin:8px 0 2px;padding:0}
.pk-item{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:4px;font-weight:600;cursor:pointer}
.pk-item:hover{background:color-mix(in srgb,var(--topic) 12%,transparent)}
.pk-item input{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--green);margin:0}
.pk-item .sub-count{margin-left:auto}
.rlabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.rlabel output{font:700 1.2rem var(--fm);color:var(--green)}
input[type=range]{padding:0;min-height:36px;border:0;background:transparent;accent-color:var(--brass);cursor:pointer}
@media(max-width:640px){.pk-list{grid-template-columns:1fr}}
.ticket>.row{margin-top:14px}
.qh .lv{align-self:flex-start;flex:none}
.live-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:700 .84rem var(--fm);text-transform:uppercase;letter-spacing:.06em;padding-right:56px}
.lcount{margin-left:auto;color:var(--mute)}
.ticket.live h2{font-size:1.65rem;min-height:72px}
.lclock{--p:1;float:right;position:relative;margin:0 0 10px 14px;width:76px;height:76px;border-radius:50%;border:3px solid var(--edge);background:conic-gradient(var(--brass) calc(var(--p)*1turn),var(--bg2) 0);box-shadow:3px 3px 0 var(--edge)}

const LESSON={
'g-ps':'We use the present simple for habits and facts. Add -s or -es for he, she and it. Use do/does for questions and don’t/doesn’t for negatives.|She works in a bank.|Do you like tea?|He doesn’t play football.',
'g-pc':'We use the present continuous for actions happening now. Form: am/is/are + verb-ing. Time words: now, at the moment, today.|I am reading a book.|They are not sleeping.|What are you doing?',
'g-pm':'Present simple = habits, facts, timetables (always, every day). Present continuous = now or temporary (now, today, at the moment).|I usually walk to work, but today I am taking the bus.|Water boils at 100 degrees.|She studies French every Tuesday.',
'g-tobe':'Use am with I, is with he/she/it and are with you/we/they. Negative: add not (isn’t, aren’t). For questions, put the verb first. Past: was/were.|I am a student.|Is there a bank near here?|We were at the cinema yesterday.',
'g-past':'The past simple is for finished actions in the past. Regular verbs add -ed. Irregular verbs change (go – went, buy – bought). Use did + base verb for questions and negatives.|I watched a film last night.|She didn’t know the answer.|Did you go out?',
'g-pp':'The past participle is the third form of the verb (eat – ate – eaten). Use it with have/has for the present perfect (experience, results) and with be for the passive.|Have you ever eaten sushi?|The report was written by the manager.|She has worked here since 2019.',
'g-cond':'Zero: if + present, present (facts). First: if + present, will (real future). Second: if + past, would (imaginary). Third: if + past perfect, would have + past participle (the past, impossible now).|If you heat ice, it melts.|If it rains, we will stay at home.|If I were rich, I would travel the world.|If she had studied, she would have passed.',
'g-modal':'Modal verbs (can, must, should, could) are followed by the base verb without to. can = ability, must = strong obligation, mustn’t = forbidden, should = advice, could = polite request. Don’t have to = not necessary.|I can swim.|You mustn’t park here.|You should go to bed early.',
'g-comp':'Short adjectives: -er than and the -est (slow, slower, slowest). Long adjectives: more … than and the most …. Irregular: good, better, best.|A bike is slower than a car.|She is more intelligent than her brother.|This is the best film I have seen.',
'g-art':'Use a/an with one countable noun (an before a vowel sound). Use much with uncountable nouns and many with countable nouns. A few / a little = some. Few / little = not enough. Use any in questions and negatives.|She has an orange.|How much sugar do you want?|There aren’t any chairs.',
'g-prep':'Time: at (clock times, at the weekend), on (days and dates), in (months, years, seasons). Place: in (a room, a city), on (a table, a wall), at (a point: at the station), between, next to, opposite. Learn fixed phrases: good at, interested in, afraid of, depend on, arrive in (a city) / at (a building).|The lesson starts at nine o’clock.|The bank is between the supermarket and the post office.|She is good at maths.',
'g-quest':'Question words: what, where, when, who, whose, why, how, how old, how often, how much/many. After the question word use do/does/did + subject + base verb. After did, never use the past form. In polite questions (Can you tell me…?) the word order is like a normal sentence.|Where did she go yesterday?|How often do you go swimming?|Can you tell me where the station is?',
'v-sport':'Play + ball games (play tennis). Go + -ing sports (go swimming). Places: pitch (football), court (tennis), pool, track. People: player, referee, coach, spectator.|You play football on a pitch.|The referee blows the whistle.|A helmet protects your head.',
'v-daily':'Daily routine: get up, brush your teeth, have breakfast, go to work. We do the dishes, do the housework, make the bed and take a shower. Chores are jobs at home.|I brush my teeth every morning.|I do the dishes after dinner.',
'v-clothes':'Shoes, boots and sandals go on your feet. Gloves go on your hands. A scarf and a hat keep you warm. Clothes fit you (size) and suit you (style).|Put on your coat. It is cold.|This jacket doesn’t fit me.',
'v-home':'Rooms: kitchen, bathroom, bedroom, living room. Furniture: bed, sofa, armchair, table, wardrobe, bookcase, chest of drawers. Windows and curtains are not furniture.|You cook in the kitchen.|You keep your clothes in the wardrobe.',
'v-food':'Food groups: vegetables (carrot), fruit (apple), dairy (milk, cheese, yoghurt), grains (bread, rice). Meals: breakfast, lunch, dinner.|Bread is made from flour.|Milk is a dairy product.',
'v-family':'Aunt and uncle = your parents’ sister and brother. Cousin = their child. Niece and nephew = the daughter and son of your brother or sister. In-law = your husband’s or wife’s family.|My mother’s sister is my aunt.|My husband’s mother is my mother-in-law.',
'v-jobs':'Jobs: nurse, doctor, dentist, pilot, chef, farmer, mechanic, teacher, shop assistant. A salary is the money you get every month from your job. You apply for a job. When you stop working because you are old, you are retired.|A nurse works in a hospital.|A mechanic repairs cars.|She applied for a job at the bank.',
'v-desc':'Adjectives describe nouns. Learn opposites in pairs: big – small, hot – cold, young – old, cheap – expensive, safe – dangerous. Stronger words: delighted = very happy, huge = very big, excellent / brilliant = very good. -ed = how you feel (bored); -ing = what makes you feel it (boring).|The opposite of cheap is expensive.|The film was boring.|I was delighted to see you.',
'e-daily':'Telling the time: half past seven = 7:30; a quarter past three = 3:15; a quarter to nine = 8:45; ten to seven = 6:50. Midday = 12:00 in the day; midnight = 12:00 at night. Days: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.|It is half past seven.|8:45 is a quarter to nine.|What time is it?',
'e-shop':'Shopping phrases: How much is it? / How much are they? I’m just looking. Can I try this on? Do you have this in a bigger size? Can I pay by card? Here is your change and your receipt. In the sale = cheaper. A refund = your money back.|How much are these shoes?|Can I try this on, please?|Can I get a refund?',
'e-food':'Restaurant English: A table for two, please. Can I see the menu, please? I’ll have the fish. I’d like a coffee, please. Could we have the bill? I’m full = I can’t eat any more. A tip is extra money for the waiter.|I’d like a coffee, please.|Could we have the bill, please?|No dessert, thanks. I’m full.',
'e-travel':'Travel English: Where is the station? How do I get to the museum? Go straight on. Turn left / right. It’s on your left. A single ticket (one way), a return ticket (there and back). Wait on the platform. Check in at the airport. A flight can be delayed (late) or cancelled (it doesn’t happen).|How do I get to the museum?|A return ticket to Leeds, please.|The flight was cancelled.',
'e-social':'Polite English: Could I have …? Would you mind …? Thank you – You’re welcome. Sorry! (when you make a mistake) Bless you! (when someone sneezes) Congratulations! (good news). On the phone: “Can I speak to Anna?” – “Speaking.” Can I leave a message?|Could I have some water, please?|Would you mind opening the window?|Congratulations on your new job!',
'w-uk':'The UK has four countries: England (capital London), Scotland (Edinburgh), Wales (Cardiff) and Northern Ireland (Belfast). The money is the pound. Big Ben is in London and the London Underground is called the tube. The Severn is the longest river in the UK. Shakespeare was born in Stratford-upon-Avon.|Big Ben is in London.|Edinburgh is the capital of Scotland.|The money in the UK is the pound.',
'w-geo':'Capitals: London (the UK), Paris (France), Berlin (Germany), Rome (Italy), Madrid (Spain), Tokyo (Japan), Washington, D.C. (the USA), Ottawa (Canada), Canberra (Australia). Russia is the biggest country. India has the most people. The Atlantic Ocean is between Europe and America.|Berlin is the capital of Germany.|Tokyo is in Japan.|Russia is the biggest country in the world.',
'w-facts':'Useful numbers: 60 seconds = 1 minute, 24 hours = 1 day, 7 days = 1 week (168 hours), 12 months = 1 year, 365 days = 1 year (366 in a leap year). A dozen = 12. The English alphabet has 26 letters. April, June, September and November have 30 days. Spelling: thirteen, forty (not fourty), a million.|There are seven days in a week.|A dozen eggs is twelve eggs.|February has twenty-nine days in a leap year.',
'w-culture':'New Year’s Day is on 1 January. Valentine’s Day is on 14 February (cards and flowers). April Fools’ Day is on 1 April (jokes). At Easter children look for chocolate eggs. Halloween is on 31 October (“Trick or treat!”). Bonfire Night is on 5 November. Christmas is on 25 December and Boxing Day is on 26 December. Thanksgiving is a big holiday in the USA.|We celebrate Christmas on the twenty-fifth of December.|Children say “Trick or treat!” at Halloween.|A roast dinner is traditional on Sundays.',
'g-pastc':'Past continuous = was/were + verb-ing. Use it for an action in progress at a time in the past. Use it with the past simple for a longer action that something interrupts (when / while).|At 8 o’clock I was cooking dinner.|I was sleeping when my phone rang.|While we were eating, the lights went out.',
'g-future':'Use will for decisions at the moment of speaking, offers, promises and predictions (I think it will …). Use be going to for plans and for things we can see will happen. Negative: will not = won’t.|I’m tired. I think I will go to bed.|We are going to visit our cousins.|Look at the clouds! It is going to rain.',
'g-pron':'Subject: I, you, he, she, it, we, they. Object: me, you, him, her, it, us, them. Possessive + noun: my, your, his, her, its, our, their. Possessive without noun: mine, yours, his, hers, ours, theirs. Reflexive: myself, herself, themselves. its = belonging to it; it’s = it is.|This is her bag. It’s hers.|Can you help me?|She made the cake herself.',
'g-noun':'Most plurals add -s or -es (box – boxes). Consonant + y changes to -ies (baby – babies). Some plurals are irregular: man – men, woman – women, child – children, foot – feet, tooth – teeth, knife – knives. Uncountable nouns (advice, information, news, furniture) have no plural. Use containers: a glass of water, a bar of chocolate.|Two women and three children.|She gave me some good advice.|The news is good.',
'g-adv':'Adverbs of frequency (always, usually, often, sometimes, hardly ever, never) go before the main verb but after be. Many adverbs of manner add -ly to the adjective (quick – quickly, careful – carefully, dangerous – dangerously). Irregular: good – well, fast – fast, hard – hard.|I often go to the cinema.|She is always late.|She speaks English very well.',
'g-passive':'Passive = be + past participle. Use it when the action is more important than the person who does it. Use by to say who or what does it. Present: is/are made. Past: was/were built.|English is spoken in many countries.|This bridge was built in 1890.|The window was broken by a ball.',
'g-verbing':'Some verbs take -ing (enjoy, finish, mind, avoid). Some take to + verb (want, decide, hope, would like). After prepositions use -ing (good at drawing, interested in learning, look forward to seeing). An -ing form can be the subject of a sentence.|I enjoy listening to music.|She wants to be a doctor.|I’m looking forward to seeing you.',
'g-rel':'Relative pronouns add information about a noun: who for people, which for things, that for people or things, where for places, whose for things that belong to someone.|The woman who lives next door is a doctor.|This is the book that I told you about.|I have a friend whose father is a pilot.',
'g-link':'and adds information, but shows a difference, or gives a choice, because gives a reason, so gives a result. Although and however show a surprising difference. First, then, next and finally show order.|I stayed at home because I was ill.|It was raining, so we took an umbrella.|Although it was cold, we went swimming.',
'g-have':'have got = own or possess (British English, present only): I have got / she has got. Questions: Have you got …? We also use have for actions: have breakfast, have a shower, have a good time. Negative with do: I don’t have a car. have something done = someone does it for you.|I have got two brothers.|Have you got a pen?|We have lunch at one o’clock.',
'v-body':'Body: head, face, eyes, ears, nose, mouth, teeth, neck, chest, arm, hand, finger, leg, knee, foot. Problems: I have a headache / toothache / a cold / a fever. I broke my arm. The doctor gives you a prescription for medicine.|I have a headache.|I see with my eyes.|I fell and broke my arm.',
'v-weather':'Weather nouns and adjectives: sun – sunny, rain – rainy, cloud – cloudy, wind – windy, fog – foggy, snow – snowy. Ask: What’s the weather like? Seasons: spring, summer, autumn, winter. A storm has thunder and lightning. A forecast tells you the weather for tomorrow.|What’s the weather like today?|It’s sunny and warm.|There was a storm last night.',
'v-animals':'Farm animals: cow, sheep, pig, horse, chicken. Wild animals: lion, tiger, elephant, monkey, giraffe. A baby dog is a puppy. Nature: tree, flower, grass, river, lake, mountain, forest. We must protect the environment and stop pollution.|A cow says “moo”.|A baby dog is a puppy.|We must protect the environment.',
'v-town':'Places: bank, library, post office, hospital, cinema, museum, supermarket, market, police station, park. You borrow books from a library and watch films at the cinema. Cross the road at a pedestrian crossing. Traffic = the cars on the road.|You borrow books from a library.|The bank is next to the post office.|There is a lot of traffic in the city centre.',
'v-transport':'go by bus / train / car / plane / bike, but on foot. get on / get off a bus, train or plane; get in / get out of a car or taxi. A single ticket is one way; a return ticket is there and back. A plane takes off and lands. A lorry carries things on the road.|I go to work by bus.|We got off the train at York.|The plane took off at six.',
'v-tech':'Computer words: screen, keyboard, mouse, password, website, link, app, file, Wi-Fi. Verbs: download, upload, click, send, attach, charge (a battery), log in.|I downloaded a new app.|Please attach the file to the email.|My phone battery is empty. I need to charge it.',
'v-free':'Hobbies: reading, painting, photography, cooking, camping, playing the guitar. go + -ing (go camping), play + the + instrument (play the piano), go for a walk. A play is a story you watch at the theatre. take up = start a new hobby; give up = stop.|I like reading in my free time.|She plays the piano.|He took up the guitar last year.',
'v-feel':'Feelings: happy, sad, angry, bored, tired, hungry, thirsty, afraid (of), worried, excited (about), proud (of), embarrassed, jealous. -ed adjectives describe how you feel; -ing adjectives describe the thing: I am bored because the film is boring.|I’m hungry. Let’s eat.|I’m excited about my holiday.|The film was boring, so I was bored.',
'v-phrasal':'Phrasal verbs = verb + small word with a new meaning: get up, wake up, sit down, put on, take off, turn on / off, turn up / down, look for (try to find), look after (take care of), give up (stop), run out of (have none left), fill in (a form), get on with (be friendly with).|Put on your coat.|I’m looking for my keys.|We have run out of milk.',
'v-collo':'make = create or produce: make a cake, make a mistake, make a phone call, make friends, make money, make a noise, make a decision. do = activities and work: do homework, do the shopping, do exercise, do your best, do someone a favour. have: have a party, have breakfast, have fun. take: take a photo, take a break, take a bus.|Everyone makes mistakes.|I do my homework after school.|Can you take a photo of us?',
'v-school':'School subjects: maths, English, science, history, geography, art, music, PE. Things: pen, pencil, rubber, ruler, notebook. You take an exam and you pass or fail it. You get good or bad marks. Homework is uncountable (not homeworks). A teacher teaches; a student learns. After school some students go to university.|I have maths on Monday.|I hope I pass my exam.|The teacher gave us a lot of homework.',
'v-holiday':'Holiday words: suitcase, passport, ticket, hotel, campsite, beach, sun cream, towel, guidebook, view, trip. Verbs: book a room, pack your bag, go sightseeing, go skiing. A trip is a short journey to a place and back.|We booked a room online.|Don’t forget your sun cream.|The hotel had a beautiful view of the sea.',
'e-intro':'Greetings: Hello / Hi / Good morning. How are you? – I’m fine, thanks. And you? Nice to meet you. / Pleased to meet you. Questions: What’s your name? Where are you from? What do you do? (= What is your job?) How do you spell your surname?|Hi, I’m Sam. Nice to meet you.|Where are you from? – I’m from Brazil.|What do you do? – I’m a nurse.',
'e-health':'At the doctor’s: What’s the matter? I don’t feel well. I’ve got a headache / a sore throat / a cold. Where does it hurt? Take this medicine three times a day. Make an appointment to see the doctor. Buy medicine at a pharmacy. In an emergency call an ambulance. I hope you feel better soon.|What’s the matter?|I’ve got a sore throat.|I hope you feel better soon.',
'e-hotel':'At a hotel: I have a reservation. A single room (one person), a double room (two people). Check in when you arrive and check out when you leave. Get your key at reception. Is breakfast included? Could you fix the shower? Could I have a wake-up call?|I have a reservation for two nights.|Is breakfast included?|What time is check-out?',
'e-plans':'Inviting: Would you like to …? Do you want to …? Suggesting: Let’s … / Shall we …? / How about …? / Why don’t we …? Answering: Yes, I’d love to! / Good idea! / Sorry, I can’t make it. I’m busy.|Would you like to come to my party?|How about eight o’clock?|Sorry, I can’t make it.',
'e-opinion':'Giving opinions: I think … / In my opinion … / I believe … Agreeing: I agree (with you). / You’re right. / That’s a good idea. Disagreeing politely: I’m not sure. / I don’t agree. / Not really. Never say “I am agree”.|In my opinion, English is easy.|I agree with you.|I’m not sure about that.',
'e-help':'Asking for help: Can you help me? Could you repeat that, please? Could you speak more slowly? Offering: Shall I …? Can I help you? Let me … Apologising: I’m sorry I’m late. Answering: Don’t worry about it. / No problem. / That’s very kind of you.|Could you speak more slowly, please?|Shall I carry your bag?|I’m so sorry. – Don’t worry about it.',
'e-msg':'Informal emails: start with Hi … / Dear …, and end with Love, / Best wishes, / See you soon. Formal emails: start with Dear Sir or Madam, and end with Yours faithfully or Regards. Useful: Thanks for your message. I’m writing to ask … I look forward to hearing from you. Please find the document attached. ASAP = as soon as possible.|Thanks for your message.|I’m writing to ask about my order.|I look forward to hearing from you.',
'e-class':'Classroom phrases: How do you spell …? What does … mean? How do you say … in English? Can you say that again, please? Sorry, I don’t understand. Work in pairs. Open your books at page 20. Can I borrow your pen? (borrow = take for a short time; lend = give for a short time)|How do you spell “library”?|What does “huge” mean?|Can I borrow your dictionary, please?',
'w-nature':'We live on Earth. It goes around the Sun. The biggest planet is Jupiter and the biggest ocean is the Pacific. The highest mountain is Everest. There are seven continents: Africa, Antarctica, Asia, Australia, Europe, North America and South America. The Sahara is a desert. The Nile is one of the longest rivers in the world.|The Earth goes around the Sun.|Everest is the highest mountain in the world.|The Pacific is the biggest ocean.',
'w-science':'Water boils at 100 °C and freezes at 0 °C. Ice is frozen water. Plants need water, air and sunlight. The heart pumps blood and we breathe with our lungs. People need oxygen. An adult has about 206 bones. The Moon goes around the Earth.|Water freezes at zero degrees.|The heart pumps blood around the body.|Plants need sunlight to grow.',
'w-food':'Famous dishes: pizza, pasta and risotto (Italy), sushi (Japan), tacos (Mexico), paella (Spain), croissants (France), curry (India), fish and chips (the UK). Tea is popular in China, India and the UK.|Sushi comes from Japan.|Paella is a rice dish from Spain.|Fish and chips is a British dish.',
'w-sport':'A football team has eleven players on the pitch. Wimbledon is a famous tennis competition in London. The Summer Olympic Games happen every four years; the medals are gold, silver and bronze. Cricket is popular in India and the UK; rugby is popular in New Zealand. A marathon is about 42 kilometres. Winter sports: skiing, snowboarding, ice skating.|The Olympics are every four years.|Wimbledon is a tennis competition.|A marathon is about 42 kilometres long.',
'w-time':'Months: January, February, March, April, May, June, July, August, September, October, November, December. Seasons: spring, summer, autumn, winter. Dates use ordinal numbers: the first, second, third, twenty-first. A fortnight = two weeks, a decade = ten years, a century = one hundred years. A year has about 52 weeks.|My birthday is on the third of May.|A decade is ten years.|There are about fifty-two weeks in a year.',
'w-money':'Money: the pound (UK), the euro (France, Germany and many other countries), the dollar (USA), the yen (Japan). 100 pence = 1 pound. Measures: 100 centimetres = 1 metre, 1,000 metres = 1 kilometre, 1,000 grams = 1 kilo. We measure liquids in litres. Keep money in a wallet or purse.|There are one hundred pence in a pound.|A kilo is one thousand grams.|We buy milk in litres.'};
function lesson(sub){const p=(LESSON[sub]||'').split('|');return {rule:p[0]||'',ex:p.slice(1)}}
function tip(sub){const r=lesson(sub).rule;return r}
function fullSentence(q){try{const b=/_{3}/;if(q.t==='order')return q.a.join(' ')+'.';if(!b.test(q.q)||(q.t!=='mc'&&q.t!=='type'))return '';const w=q.t==='mc'?q.o[q.a]:q.a[0],m=q.q.match(/“([^”]*_{3}[^”]*)”/),base=m&&m[1].replace(/_/g,'').trim().length>2?m[1]:q.q;const o=base.replace(/_{3}/,w);return /^_{3}/.test(base)?o.charAt(0).toUpperCase()+o.slice(1):o}catch(e){return ''}}
function topicLabel(){return S.subs&&S.subs.length?subsLabel(S.subs):'Mixed topics'}
function ansText(q,a){try{if(q.t==='mc')return a==null?'—':q.o[a];if(q.t==='multi')return a&&a.length?a.map(i=>q.o[i]).join(', '):'—';if(q.t==='order')return a&&a.length?a.join(' '):'—';return String(a||'').trim()||'—'}catch(e){return '—'}}

 RM={name:store('cc_name')||'',mode:'Multiplayer',topic:topicLabel(),date:today()};

function stats(res){
 const n=res.length,mi=Math.min(TOTAL,res.reduce((a,x)=>a+x.mi,0)),late=res.reduce((a,x)=>a+x.delay,0),good=res.filter(r=>r.c==='good').length,mid=res.filter(r=>r.c==='mid').length,
 acc=n?Math.round(100*res.reduce((a,x)=>a+x.sc,0)/n):0,spd=res.reduce((a,x)=>a+(x.spd||0),0),stk=res.reduce((a,x)=>a+(x.stk||0),0),secs=res.reduce((a,x)=>a+(x.tm||0),0);
 let st=ROUTE[0][0];for(const [nm,m] of ROUTE)if(mi>=m)st=nm;
 const by={},subs={};
 res.forEach(r=>{if(r.lv){const b=by[r.lv]||(by[r.lv]={n:0,s:0});b.n++;b.s+=r.sc}if(r.sub){const b=subs[r.sub]||(subs[r.sub]={n:0,s:0});b.n++;b.s+=r.sc}});
 const sl=Object.entries(subs).map(([k,v])=>({k,p:v.s/v.n,n:v.n})).sort((a,b)=>b.p-a.p);
 return {n,mi,late,good,mid,acc,spd,stk,secs,st,by,sl,arrived:mi>=TOTAL};
}
function reportHTML(res,st,m,name){
 const nm=k=>SUBLABEL[k]||k,strong=st.sl.filter(x=>x.p>=.8).map(x=>nm(x.k)),weak=st.sl.filter(x=>x.p<.6).map(x=>nm(x.k));
 const study=st.sl.filter(x=>x.p<.6).slice(0,2).map(x=>`<div class="study"><b>${esc(nm(x.k))}</b><p>${esc(tip(x.k))}</p></div>`).join('');

// Live quiz: the host's screen shows each question, players answer on their own devices and every player
// drives their own train along the game's route. The server keeps the time and the score: every correct
// answer moves a train one station, and fast answers earn bonus points. Text from the server is always escaped.
let LIVE={};
const ord=n=>n+(n%100>10&&n%100<14?'th':['th','st','nd','rd'][n%10]||'th');
// The route comes with every live message; until the first question there is only the default line.
const liveLine=m=>{if(m&&m.route)LIVE.line=stopsLine(m.route.stations);return LIVE.line||stopsLine(ROUTE.map(r=>r[0]))};
const where=(k,L)=>{const [a,z]=ends(L);return k>=L.total?'Arrived in '+z:k<1?'Waiting in '+a:'At '+stationAt(k,L)};
function liveList(){
 const r=MP.room,seed=MP.seed;if(LIVE.list&&LIVE.seed===seed)return LIVE.list;
 const rr=rng(seed),o={A1:0,A2:1,B1:2},pool=Q.filter(q=>r.subs&&r.subs.length?r.subs.includes(q.sub):r.sub?q.sub===r.sub:(r.theme==='M'||q.th===r.theme));
 const all=shuffle(pool,rr);
 LIVE.seed=seed;LIVE.list=all.slice(0,r.n).map(q=>scrambleQuestion(q,rr)).sort((a,b)=>o[a.lv]-o[b.lv]);
 // Bonus round: the next questions in the shuffled pool, or the game's own questions if the pool runs out.
 LIVE.extra=[...all.slice(r.n),...all.slice(0,r.n)].slice(0,3).map(q=>scrambleQuestion(q,rr));
 return LIVE.list;
}
function liveSend(i){if(!MP.seed)return;const L=liveList(),q=i<L.length?L[i]:LIVE.extra[i-L.length];if(q)mpSend({t:'lq',i,n:L.length,time:TIME[q.t],q:{t:q.t,lv:q.lv,sub:q.sub,q:q.q,o:q.o,a:q.a,alt:q.alt,s:q.s}})}
function liveHold(msg){clearInterval(timer);app.innerHTML=`<div class="section-kicker">⚡ Live quiz · room ${esc(MP.code||'')}</div><div class="card lwait">${locoSVG(MP.spec?'#c2412d':livery(MP.id))}<b>${esc(msg)}</b><p class="mute">${MP.spec?'Show this screen to everybody.':'Keep this page open.'}</p></div>`}
function liveCtl(){return MP.host?`<div class="row"><button id="lsk">Skip ⏭</button><button id="len">End game</button></div>`:''}
function liveBindCtl(){if($('#lsk'))$('#lsk').onclick=()=>mpSend({t:'skip'});if($('#len'))$('#len').onclick=()=>{if(confirm('End the game now and show the arrivals board?'))mpSend({t:'end'})}}
const plat=i=>`<span class="plat" aria-hidden="true"><small>Platform</small><b>${i+1}</b></span>`;
const isBonus=m=>m.i>=m.n;
const stopLabel=m=>isBonus(m)?'Bonus question '+(m.i-m.n+1)+' of '+m.nb:'Stop '+(m.i+1)+' of '+m.n;
const placeOf=(b,p)=>ord(p.place)+(b.filter(x=>x.place===p.place).length>1?' (shared)':'');
function liveBoarding(){const e=$('#bd'),m=LIVE.cur;if(!e||!m)return;const who=m.who||[];e.innerHTML=(MP.room.players||[]).map(p=>`<li class="${who.includes(p.id)?'on':''}">${esc(p.name)}</li>`).join('')||'<li>Nobody yet</li>'}
function liveQuestion(m){
 clearInterval(timer);const now=performance.now();
 liveLine(m);LIVE.cur=m;LIVE.go=now+m.wait;LIVE.end=now+m.left;LIVE.open=m.wait<=0;LIVE.mine=m.answered?null:undefined;LIVE.timeup=false;LIVE.pick=[];LIVE.seq=[];
 if(!LIVE.open)SFX.whistle();
 liveDraw();let lt=99;
 timer=setInterval(()=>{
  const t=performance.now();
  if(!LIVE.open&&t>=LIVE.go){LIVE.open=true;liveDraw()}
  liveClock(t);
  const left=Math.max(0,LIVE.end-t)/1000;
  if(LIVE.open&&left<=5&&left>0&&Math.ceil(left)!==lt){lt=Math.ceil(left);SFX.tick()}
  if(LIVE.open&&left<=0&&!MP.spec&&!m.out&&LIVE.mine===undefined&&!LIVE.timeup){LIVE.timeup=true;liveDraw()}
 },100);
}
function liveClock(t){
 const c=$('#lt'),m=LIVE.cur,tb=$('#tb');if(!m)return;
 const left=Math.max(0,LIVE.end-t)/1000,frac=LIVE.open?Math.min(1,left/m.time):1;
 if(c){c.style.setProperty('--p',frac);c.querySelector('b').textContent=LIVE.open?Math.ceil(left):Math.max(1,Math.ceil((LIVE.go-t)/1000));c.classList.toggle('low',LIVE.open&&left<=5)}
 if(tb)tb.style.width=frac*100+'%';
}

 const opts=click=>`<div class="lopts">${q.o.map((o,i)=>`<${click?'button':'div'} class="lopt${LIVE.pick.includes(i)?' on':''}" data-i="${i}"${click&&q.t==='multi'?` aria-pressed="${LIVE.pick.includes(i)}"`:''}>${plat(i)}<span class="txt">${esc(o)}</span></${click?'button':'div'}>`).join('')}</div>`;
 let body;

 else body=`<input id="li" ${q.t==='num'?'type="number" inputmode="decimal"':'autocomplete="off" autocapitalize="none" spellcheck="false"'} aria-label="Your answer"><div class="row" style="margin-top:10px"><button class="main" id="lok">Send answer</button></div>`;
 const mine=pres?'':`<div class="myline">${trackHTML(LIVE.myRight||0,livery(MP.id),liveLine())}</div>`;

 app.innerHTML=`${head}<div class="bar"><i id="tb"></i></div>${mine}<div class="card ticket live">${title}${body}</div>${board}${liveCtl()}`;
 liveBindCtl();liveBoarding();liveClock(performance.now());
 if($('#ls'))$('#ls').onclick=()=>speak(q.q);
 if(pres||m.out||!LIVE.open||LIVE.mine!==undefined||LIVE.timeup)return;

 if(q.t==='multi'){app.querySelectorAll('.lopt').forEach(b=>b.onclick=()=>{SFX.click();const i=+b.dataset.i,k=LIVE.pick.indexOf(i);k<0?LIVE.pick.push(i):LIVE.pick.splice(k,1);b.classList.toggle('on',k<0);b.setAttribute('aria-pressed',k<0)});$('#lok').onclick=()=>liveAnswer(LIVE.pick.slice())}
 if(q.t==='order'){
  const draw=()=>{
   $('#seq').innerHTML=LIVE.seq.map(i=>`<button class="chip main" data-s="${i}">${esc(q.words[i])}</button>`).join('');
   $('#pool').innerHTML=q.words.map((w,i)=>LIVE.seq.includes(i)?'':`<button class="chip" data-p="${i}">${esc(w)}</button>`).join('');
   $('#seq').querySelectorAll('button').forEach(b=>b.onclick=()=>{LIVE.seq.splice(LIVE.seq.indexOf(+b.dataset.s),1);draw()});
   $('#pool').querySelectorAll('button').forEach(b=>b.onclick=()=>{SFX.click();LIVE.seq.push(+b.dataset.p);draw()});
  };draw();$('#lok').onclick=()=>liveAnswer(LIVE.seq.map(i=>q.words[i]));
 }
 const li=$('#li');if(li){li.focus();const go=()=>{if(li.value.trim())liveAnswer(li.value.trim())};$('#lok').onclick=go;li.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(!e.repeat)go()}}}

// One lane per player: every train starts where it stopped last time and rolls to its new position.
function liveLanes(list,L){
 const prev=LIVE.prev||{},[a,z]=ends(L);
 return `<div class="lanes"><div class="lanehead" aria-hidden="true"><span>Driver</span><span><span>${esc(a)}</span><span>${esc(z)}</span></span><span style="text-align:right">stations</span></div>${list.map((p,i)=>{const from=prev[p.id]||0,to=p.right,gain=to-from;
  return `<div class="lane${p.id===MP.id?' me':''}"><span class="lname"><i>${i+1}</i>${esc(p.name)}</span><div class="lrail">${L.stops.slice(1,-1).map(([s,m])=>`<i class="stn" style="left:${at(m/L.total)}"></i>`).join('')}<span class="ltrain" data-to="${to/L.total}" style="left:${at(from/L.total)}">${locoSVG(livery(p.id))}</span></div><span class="ld">${to}${gain>0?`<small>+${gain}</small>`:''}</span></div>`}).join('')}</div>`;

function liveRoll(list){requestAnimationFrame(()=>requestAnimationFrame(()=>{app.querySelectorAll('.ltrain').forEach(t=>t.style.left=at(+t.dataset.to))}));LIVE.prev=Object.assign(LIVE.prev||{},Object.fromEntries(list.map(p=>[p.id,p.right])))}

function liveReveal(m){
 clearInterval(timer);LIVE.cur=null;
 const q=m.q,me=m.me,B=isBonus(m),last=m.i>=m.n+(m.nb||0)-1,key=MP.round+'-'+m.i,L=liveLine(m),c=me?(me.none||me.sc<.4?'bad':me.sc<.8?'mid':'good'):'';

 if(fresh){LIVE.shown=key;c==='good'?SFX.good():c==='mid'?SFX.mid():c==='bad'?SFX.bad():0;SFX.clack(3)}
