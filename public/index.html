function mpOpen(first){
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>ws.send(JSON.stringify(first));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}mpMsg(m)};
 ws.onclose=()=>{if(!MP||MP.ws!==ws)return;MP.ws=null;if(MP.left)return;
  if(MP.id){MP.tries=(MP.tries||0)+1;if(MP.tries<30)setTimeout(()=>{if(MP&&!MP.ws&&!MP.left)mpOpen({t:'rejoin',code:MP.code,id:MP.id,token:MP.token})},Math.min(5000,800*MP.tries))}
  else{MP=null;const e=$('#merr');if(e)e.textContent='Could not connect to the game server. Please try again.'}};
 ws.onerror=()=>{};
 if(MP&&MP.id)MP.ws=ws;else MP={ws};
}
function mpSend(o){if(MP&&MP.ws&&MP.ws.readyState===1)MP.ws.send(JSON.stringify(o))}
function mpLeave(){if(MP){MP.left=true;mpSend({t:'leave'});try{MP.ws&&MP.ws.close()}catch(e){}}MP=null;SSX.set(null);clearInterval(timer);S=null;menu()}
function mpMsg(m){
 if(m.t==='joined'){
  MP.id=m.id;MP.token=m.token;MP.host=m.host;MP.spec=m.spec;MP.code=m.room.code;MP.room=m.room;MP.tries=0;
  SSX.set({code:MP.code,id:MP.id,token:MP.token});
  if(location.hash)try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  const me=m.room.players.find(p=>p.id===m.id);
  if(m.room.state==='lobby')mpLobby();
  else if(MP.spec)mpHostBoard();
  else if(me&&me.done&&!(S&&S.mp))mpDoneScreen();
  else if(m.room.state==='playing'&&!(S&&S.mp))mpBegin(m.room);
  else mpRefresh();
  return}
 if(m.t==='room'){if(!MP||MP.left)return;MP.room=m.room;mpRefresh();return}
 if(m.t==='start'){if(!MP||!MP.room||MP.round===m.round)return;Object.assign(MP.room,{state:'playing',round:m.round,seed:m.seed,theme:m.theme,sub:m.sub});MP.spec?mpHostBoard():mpBegin(MP.room);return}
 if(m.t==='lobby'){if(!MP)return;MP.room=m.room;MP.round=null;clearInterval(timer);S=null;mpLobby();return}
 if(m.t==='kicked'){if(MP){MP.left=true;try{MP.ws.close()}catch(e){}}MP=null;SSX.set(null);clearInterval(timer);S=null;menu();return}
 if(m.t==='err'){const had=MP&&MP.id;if(!had){try{MP&&MP.ws&&MP.ws.close()}catch(e){}MP=null;SSX.set(null)}const e=$('#merr');if(e)e.textContent=m.msg;else if(!had)menu();return}
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
function pickQs(th,r,sub){let pool=Q.filter(q=>!th||th==='M'||q.th===th);if(sub)pool=sub==='__wrong'?wrongQs():Q.filter(q=>q.sub===sub);if(sub)return shuffle(pool,r).slice(0,7).sort((a,b)=>({A1:0,A2:1,B1:2}[a.lv]-{A1:0,A2:1,B1:2}[b.lv]));const out=[];[['A1',2],['A2',3],['B1',2]].forEach(([l,n])=>out.push(...shuffle(pool.filter(q=>q.lv===l),r).slice(0,n)));if(out.length<7)out.push(...shuffle(pool.filter(q=>!out.includes(q)),r).slice(0,7-out.length));const o={A1:0,A2:1,B1:2};return out.sort((a,b)=>o[a.lv]-o[b.lv])}

 const played=d&&d.date===today(),th=dayTh(),n=streak();
 const groups=GROUPS,P=prog(),WQ=wrongQs();
 const cards=groups.map(g=>{const count=Q.filter(q=>q.th===g.k).length;return `<section class="topic-card" data-topic="${g.k}"><div class="topic-head"><div class="topic-icon">${g.icon}</div><div><h3>${g.name}</h3><p>${g.desc} · ${count} questions</p></div></div><div class="subtopics">${g.subs.map(sub=>{if(sub[0]==='#')return `<div class="subhead">${sub.slice(1)}</div>`;const c=Q.filter(q=>q.sub===sub).length;return `<button class="subtopic" data-th="${g.k}" data-sub="${sub}"><span>${SUBLABEL[sub]}</span><span class="sub-count">${c} ${c===1?'Q':'Qs'}${P[sub]&&P[sub].n>=2?' · '+Math.round(100*P[sub].s/P[sub].n)+'%':''}</span></button>`}).join('')}</div><button class="topic-all" data-t="${g.k}">Practise all ${g.name.toLowerCase()} →</button></section>`}).join('');
 app.innerHTML=`<header class="masthead"><div class="eyebrow">All aboard · English practice</div><h1>Clickety-Clack</h1><p class="subtitle">A little practice. A longer journey. Build your English from A1 to B1.</p></header>
 <div class="card feature-card"><div class="feature-top"><div><div class="section-kicker">🚦 Today’s departure</div><h2>Daily challenge</h2><p>Today’s focus: <b>${IC[th]} ${TN[th]}</b>. Seven questions, one shared challenge.</p><p class="mute">${n?'🔥 '+n+(n>1?' days':' day')+' in a row':'Play today to start your streak.'}</p></div><div class="feature-emoji">🎟️</div></div><div class="row" style="margin-top:12px"><button class="main" id="dc">${played?'See today’s result':'Start today’s train'} →</button><button id="mix">🎲 Mixed practice</button></div></div>
 ${WQ.length?`<div class="card"><div class="section-kicker">🔁 Learn from mistakes</div><h2>Fix my mistakes</h2><p class="mute">${WQ.length} question${WQ.length>1?'s':''} to try again. Answer correctly to remove them from the list.</p><button class="main" id="fx">Practise my mistakes →</button></div>`:''}
 <div class="section-kicker">Choose your learning route</div><h2>Explore by topic</h2><p class="mute">Pick a whole subject or go straight to a smaller theme. Short topic rounds use the questions available in that theme.</p><div class="menu-grid">${cards}</div>
 <section class="card"><div class="section-kicker">🎮 Play together</div><h2>Multiplayer</h2><p class="mute">Create a room, share the QR code, and race on a live leaderboard.</p><div class="row"><button class="main" id="mph">Host a game</button><button id="mpj">Join with a code</button></div></section>
 <section class="card"><div class="section-kicker">👩‍🏫 For the classroom</div><h2>Class game</h2><p class="mute">Create a shared quiz link and QR code for your students.</p><label for="cs">Choose a topic</label><select id="cs" aria-label="Topic">${'GVEWM'.split('').map(k=>`<option value="${k}">${k==='M'?'🎲 Mixed topics':IC[k]+' '+TN[k]}</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="main" id="cg">Create class game →</button></div></section>
 <details class="card details-card"><summary>How to play</summary><ul><li>Daily and full-topic rounds have 7 questions, from A1 to B1.</li><li>Short theme rounds include the questions available for that theme.</li><li>Correct answers add miles and carriages; quick answers and streaks can earn bonuses.</li><li>London to Edinburgh is ${TOTAL} miles. Can you get the train all the way there?</li></ul></details>`;
 $('#dc').onclick=()=>{if(played){RM=d.meta||{name:store('cc_name')||'',mode:'Daily challenge',topic:'',date:d.date};result(d.res,true)}else{SFX.whistle();start(false,th)}};
 $('#mix').onclick=()=>{SFX.whistle();start(true,'M')};
 if($('#fx'))$('#fx').onclick=()=>{SFX.whistle();start(true,'M',undefined,undefined,'__wrong')};
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SFX.whistle();start(true,b.dataset.t)});
 app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{SFX.click();lessonScreen(b.dataset.sub,b.dataset.th)});
 $('#cg').onclick=()=>classHost($('#cs').value);
 $('#mph').onclick=mpHostScreen;$('#mpj').onclick=()=>mpJoinScreen('');
}
function drawBoard(code){let a=[];try{a=JSON.parse(store('cc_board_'+code))||[]}catch(e){}a.sort((x,y)=>y.m-x.m||x.l-y.l);$('#bd').innerHTML=a.length?`<ol>${a.map(x=>`<li><b>${esc(x.n)}</b> ${x.m} miles · ${x.l} min late ${esc(x.s)}</li>`).join('')}</ol>`:''}
function classHost(th){
 const code=[0,0,0,0].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''),link=BASE+'#class-'+code+'-'+th;
 app.innerHTML=`<h1>Class game</h1><p class='mute'>Topic: ${th==='M'?'Mixed topics':TN[th]} · code <b>${code}</b></p><div class='card'><p>Students scan this QR code, type their name and play the same 7 questions.</p><div id='qr' style='background:#fff;padding:10px;width:fit-content;margin:8px auto'></div><p class='mute' style='word-break:break-all'>${link}</p><div class='row'><button class='main' id='play'>Play too</button><button id='mn'>Menu</button></div></div><div class='card'><h2>Class board</h2><p class='mute'>Each student taps “Copy line” at the end and sends it to you. Paste the lines here.</p><textarea id='ta' rows='3' aria-label='Results'></textarea><div class='row' style='margin-top:8px'><button id='add'>Add to board</button></div><div id='bd'></div></div>`;
 $('#qr').innerHTML='<img src="/qr.svg?u='+encodeURIComponent(link)+'" alt="QR code" width="200" height="200">'
 $('#play').onclick=()=>classJoin(code,th);$('#mn').onclick=menu;
 $('#add').onclick=()=>{let a=[];try{a=JSON.parse(store('cc_board_'+code))||[]}catch(e){}$('#ta').value.split('\n').forEach(l=>{const p=l.split('|').map(s=>s.trim());if(p.length>=3&&p[0]&&Number.isFinite(Number(p[1]))&&Number(p[1])>=0&&Number.isFinite(Number(p[2]||0))&&Number(p[2]||0)>=0){a=a.filter(x=>x.n!==p[0].slice(0,24));a.push({n:p[0].slice(0,24),m:Math.round(Number(p[1])),l:Math.round(Number(p[2]||0)),s:(p[3]||'').slice(0,12)})}});store('cc_board_'+code,JSON.stringify(a));$('#ta').value='';drawBoard(code)};
 drawBoard(code);
}
function classJoin(code,th){
 app.innerHTML=`<h1>Class game</h1><p class='mute'>Topic: ${th==='M'?'Mixed topics':TN[th]} · code ${code}</p><div class='card'><label for='nm'>Your name</label><input id='nm' maxlength='24' autocomplete='nickname' value='${esc(store('cc_name')||'')}'><div class='row' style='margin-top:12px'><button class='main' id='go'>Start</button></div></div>`;
 $('#go').onclick=()=>{const n=$('#nm').value.trim().slice(0,24);if(!n){$('#nm').focus();return}store('cc_name',n);SFX.whistle();start(true,th,'cls'+code,{code,n})};
}
function clsDone(){
 const res=S.res,mi=Math.min(TOTAL,res.reduce((a,x)=>a+x.mi,0)),late=res.reduce((a,x)=>a+x.delay,0),line=S.cls.n.replace(/\|/g,'/')+' | '+mi+' | '+late+' | '+res.map(r=>r.c==='good'?'🟩':r.c==='mid'?'🟨':'⬛').join('');
 app.insertAdjacentHTML('beforeend',`<div class='card'><h2>Class ${S.cls.code}</h2><p>Send this line to your teacher:</p><p><b>${esc(line)}</b></p><button id='cl'>Copy line</button></div>`);
 $('#cl').onclick=()=>{try{navigator.clipboard.writeText(line)}catch(e){}$('#cl').textContent='Copied!'};
}
initSnd();route();
</script>
</body>
</html>
