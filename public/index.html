let AC=null,muted=false;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d,type,t0,vol){const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(t0||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,t0,vol,fq){const c=ac();if(!c||muted)return;const n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='bandpass';f.frequency.value=fq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+(t0||0))}
const SFX={
 click:()=>tone(520,.06,'square',0,.05),
 tick:()=>tone(900,.04,'square',0,.06),
 good:()=>{tone(660,.14,'triangle',0,.2);tone(880,.28,'triangle',.11,.2)},
 mid:()=>{tone(523,.14,'triangle',0,.17);tone(587,.22,'triangle',.12,.15)},
 bad:()=>{tone(220,.25,'sawtooth',0,.1);tone(165,.4,'sawtooth',.2,.1)},
 clack:n=>{for(let i=0;i<n;i++){noise(.06,i*.3,.35,1600);noise(.06,i*.3+.13,.3,1100)}},
 whistle:()=>{tone(740,.45,'sine',0,.13);tone(932,.6,'sine',.05,.1)},
 fanfare:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',i*.15,.2))
};
function initSnd(){const b=$('#snd'),r=()=>{b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-label',muted?'Sound is off. Turn sound on':'Sound is on. Turn sound off')};r();b.onclick=()=>{muted=!muted;store('cc_mute',muted?'1':'0');r();if(!muted)SFX.click()}}
function adv(m){const b=$('.track b');if(!b)return;b.style.left=Math.min(100,m/TOTAL*100)+'%';b.classList.add('run');const e=$('.ends span:nth-child(2)');if(e)e.textContent=Math.min(m,TOTAL)+' / '+TOTAL+' miles';let n=0;const iv=setInterval(()=>{const p=document.createElement('i');p.className='puff';p.style.left=b.offsetLeft+'px';b.parentNode.appendChild(p);setTimeout(()=>p.remove(),950);if(++n>4){clearInterval(iv);b.classList.remove('run')}},130)}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const cs=['#c8102e','#23874a','#c58b00','#2a5db0','#e8eef6'];for(let i=0;i<46;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=cs[i%5];e.style.animationDelay=Math.random()*.6+'s';e.style.animationDuration=(1.8+Math.random()*1.4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}}
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function rng(s){let h=0;for(const c of s)h=Math.imul(31,h)+c.charCodeAt(0)|0;return()=>{h|=0;h=h+0x6D2B79F5|0;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dailyUserId(){let id=store('cc_daily_user');if(!id){id='u-'+Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);store('cc_daily_user',id)}return id}
function dailySeed(){return 'cc-'+dailyUserId()+'-'+today()}
function scrambleQuestion(q,r){if(!q||!r)return q;const out=JSON.parse(JSON.stringify(q));if(Array.isArray(out.o)&&typeof out.a==='number'){const map=shuffle(out.o.map((_,i)=>i),r);out.o=map.map(i=>q.o[i]);out.a=map.indexOf(out.a)}else if(Array.isArray(out.o)&&Array.isArray(out.a)){const map=shuffle(out.o.map((_,i)=>i),r);out.o=map.map(i=>q.o[i]);out.a=out.a.map(i=>map.indexOf(i)).filter(v=>v>=0).sort((a,b)=>a-b)}return out}
const norm=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ");
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?0:j}for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function score(q,ans){
 if(q.t==="mc")return ans===q.a?1:0;
 if(q.t==="multi"){const p=ans||[],r=p.filter(x=>q.a.includes(x)).length,w=p.length-r;return Math.max(0,(r-w)/q.a.length)}
 if(q.t==="type"){const x=norm(ans||"");return q.a.some(c=>{const n=norm(c);return x===n||(n.length>=4&&x&&lev(x,n)<=1)})?1:0}
 if(q.t==="num"){const v=parseFloat(ans);return isNaN(v)?0:Math.max(0,1-Math.abs(v-q.a)/q.s)}
 if(q.t==="order"){const p=(ans||[]).map(s=>s.toLowerCase());return Math.max(...[q.a,...(q.alt||[])].map(v=>v.filter((w,i)=>p[i]===w.toLowerCase()).length/v.length))}
}
const correctText=q=>q.t==="mc"?q.o[q.a]:q.t==="multi"?q.a.map(i=>q.o[i]).join(", "):q.t==="type"?q.a[0]:q.t==="num"?String(q.a):q.a.join(" ")+(q.alt?" (also: "+q.alt.map(v=>v.join(" ")).join(" / ")+")":"");

}

 const getAns=()=>q.t==="multi"?pick:q.t==="mc"?pick:q.t==="order"?seq.map(i=>q.a[i]):($("#ti")||{}).value;
 const drawOrder=()=>{
  $("#seq").innerHTML=seq.map(i=>`<button class="chip main" data-s="${i}">${q.a[i]}</button>`).join("");

  $("#seq").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(done)return;seq.splice(seq.indexOf(+b.dataset.s),1);drawOrder()});
  $("#pool").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(done)return;seq.push(+b.dataset.p);drawOrder()});
 };
 if(q.t==="order")drawOrder();
 if($("#ls"))$("#ls").onclick=()=>speak(q.q);

 if(q.t==="mc"||q.t==="multi")app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{

  if(q.t==="mc"){pick=i;app.querySelectorAll(".opts button").forEach(x=>x.classList.toggle("on",x===b))}
  else{const k=pick.indexOf(i);k<0?pick.push(i):pick.splice(k,1);b.classList.toggle("on",k<0);b.setAttribute("aria-pressed",k<0)}
 });
 const ti=$("#ti");if(ti){ti.focus();ti.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(!e.repeat)submit()}}}
 function submit(){
  if(done)return;done=true;clearInterval(timer);
  const sc=score(q,getAns()),spd=sc>=.8?Math.round(8*Math.max(0,left)/total):0,stk=sc>=.8&&S.res.length>1&&S.res.slice(-2).every(x=>x.c==='good')?8:0,mi2=Math.round(LV[q.lv]*sc)+spd+stk,delay=Math.round(MAXDELAY*(1-sc)),c=sc>=.8?'good':sc>=.4?'mid':'none';
  S.res.push({mi:mi2,delay,c,sc,lv:q.lv,sub:q.sub,th:q.th,q:q.q,ya:ansText(q,getAns()),ca:correctText(q),spd,stk,tm:Math.round(total-Math.max(0,left))});
  if(S.mp){const st=stats(S.res);mpSend({t:'progress',i:S.res.length,mi:st.mi,late:st.late,sq:S.res.map(r=>r.c[0]).join('')})}
  if(q.t==="mc"||q.t==="multi")app.querySelectorAll(".opts button").forEach(b=>{const i=+b.dataset.i,right=q.t==="mc"?i===q.a:q.a.includes(i),chosen=q.t==="mc"?pick===i:pick.includes(i);b.classList.remove("on");if(right)b.classList.add("ok");else if(chosen)b.classList.add("no");b.disabled=true});
  if(ti)ti.disabled=true;
  const fs=fullSentence(q),tp=c!=="good"?tip(q.sub):"",last=S.i===S.qs.length-1,msg=c==="good"?"Great!":c==="mid"?"Not bad.":"Not this time.";
  $("#fb").innerHTML=`<div class="fb ${c}"><b>${msg}</b> +${mi2} miles${spd||stk?` (${[spd&&'speed +'+spd,stk&&'streak +'+stk].filter(Boolean).join(', ')})`:''} · ${delay} min late<br><span class="mute">Correct answer: ${correctText(q)}</span>${fs?`<br><span class="fs">✔ ${esc(fs)}</span>${TTS?` <button class="chip lis" data-say="${esc(fs)}" aria-label="Listen to the sentence">🔊</button>`:""}`:""}</div>${tp?`<div class="tip">💡 ${esc(tp)}</div>`:""}`;

  const b=$("#ok");b.textContent=last?"See your journey":"Next question";b.disabled=false;

 }

 let lt=99;timer=setInterval(()=>{left-=.1;$('#tb').style.width=Math.max(0,left/total*100)+'%';const s=Math.ceil(left);if(left<=5&&left>0&&s!==lt){lt=s;SFX.tick()}if(left<=0)submit()},100);

function lesson(sub){const p=(LESSON[sub]||'').split('|');return {rule:p[0]||'',ex:p.slice(1)}}
function tip(sub){const r=lesson(sub).rule;return r}
function fullSentence(q){try{const b=/_{3}/;if(q.t==='order')return q.a.join(' ')+'.';if(!b.test(q.q)||(q.t!=='mc'&&q.t!=='type'))return '';const w=q.t==='mc'?q.o[q.a]:q.a[0],m=q.q.match(/“([^”]*_{3}[^”]*)”/),base=m&&m[1].replace(/_/g,'').trim().length>2?m[1]:q.q;const o=base.replace(/_{3}/,w);return /^_{3}/.test(base)?o.charAt(0).toUpperCase()+o.slice(1):o}catch(e){return ''}}
function prog(){try{return JSON.parse(store('cc_prog'))||{}}catch(e){return {}}}
function wrongQs(){let W=[];try{W=JSON.parse(store('cc_wrong'))||[]}catch(e){}return Q.filter(q=>W.includes(q.q))}
function trackProg(res){const P=prog();let W=[];try{W=JSON.parse(store('cc_wrong'))||[]}catch(e){}
 res.forEach(r=>{if(r.sub){const b=P[r.sub]||(P[r.sub]={n:0,s:0});b.n++;b.s+=r.sc;if(b.n>30){b.n*=.8;b.s*=.8}}if(r.q){W=W.filter(x=>x!==r.q);if(r.c!=='good')W.push(r.q)}});
 store('cc_prog',JSON.stringify(P));store('cc_wrong',JSON.stringify(W.slice(-60)))}

function ansText(q,a){try{if(q.t==='mc')return a==null?'—':q.o[a];if(q.t==='multi')return a&&a.length?a.map(i=>q.o[i]).join(', '):'—';if(q.t==='order')return a&&a.length?a.join(' '):'—';return String(a||'').trim()||'—'}catch(e){return '—'}}

function stats(res){
 const n=res.length,mi=Math.min(TOTAL,res.reduce((a,x)=>a+x.mi,0)),late=res.reduce((a,x)=>a+x.delay,0),good=res.filter(r=>r.c==='good').length,mid=res.filter(r=>r.c==='mid').length,
 acc=n?Math.round(100*res.reduce((a,x)=>a+x.sc,0)/n):0,spd=res.reduce((a,x)=>a+(x.spd||0),0),stk=res.reduce((a,x)=>a+(x.stk||0),0),secs=res.reduce((a,x)=>a+(x.tm||0),0);
 let st=ROUTE[0][0];for(const [nm,m] of ROUTE)if(mi>=m)st=nm;
 const by={},subs={};
 res.forEach(r=>{if(r.lv){const b=by[r.lv]||(by[r.lv]={n:0,s:0});b.n++;b.s+=r.sc}if(r.sub){const b=subs[r.sub]||(subs[r.sub]={n:0,s:0});b.n++;b.s+=r.sc}});
 const sl=Object.entries(subs).map(([k,v])=>({k,p:v.s/v.n,n:v.n})).sort((a,b)=>b.p-a.p);

}

const SSX={get(){try{return JSON.parse(sessionStorage.getItem('cc_mp'))}catch(e){return null}},set(v){try{v?sessionStorage.setItem('cc_mp',JSON.stringify(v)):sessionStorage.removeItem('cc_mp')}catch(e){}}};
const SQE={g:'🟩',m:'🟨',n:'⬛'};
function mpOpen(first){
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>ws.send(JSON.stringify(first));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}mpMsg(m)};
 ws.onclose=()=>{if(!MP||MP.ws!==ws)return;MP.ws=null;if(MP.left)return;
  if(MP.id){MP.tries=(MP.tries||0)+1;if(MP.tries<30)setTimeout(()=>{if(MP&&!MP.ws&&!MP.left)mpOpen({t:'rejoin',code:MP.code,id:MP.id,token:MP.token})},Math.min(5000,800*MP.tries))}
  else{MP=null;const e=$('#merr');if(e)e.textContent='Could not connect to the game server. Please try again.'}};
 ws.onerror=()=>{};
 if(MP&&MP.id)MP.ws=ws;else MP={ws};
}
function mpSend(o){if(MP&&MP.ws&&MP.ws.readyState===1)MP.ws.send(JSON.stringify(o))}
function mpLeave(){if(MP){MP.left=true;mpSend({t:'leave'});try{MP.ws&&MP.ws.close()}catch(e){}}MP=null;SSX.set(null);clearInterval(timer);S=null;menu()}
function mpMsg(m){
 if(m.t==='joined'){
  MP.id=m.id;MP.token=m.token;MP.host=m.host;MP.spec=m.spec;MP.code=m.room.code;MP.room=m.room;MP.tries=0;
  SSX.set({code:MP.code,id:MP.id,token:MP.token});
  if(location.hash)try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  const me=m.room.players.find(p=>p.id===m.id);
  if(m.room.state==='lobby')mpLobby();
  else if(MP.spec)mpHostBoard();
  else if(me&&me.done&&!(S&&S.mp))mpDoneScreen();
  else if(m.room.state==='playing'&&!(S&&S.mp))mpBegin(m.room);
  else mpRefresh();
  return}
 if(m.t==='room'){if(!MP||MP.left)return;MP.room=m.room;mpRefresh();return}
 if(m.t==='start'){if(!MP||!MP.room||MP.round===m.round)return;Object.assign(MP.room,{state:'playing',round:m.round,seed:m.seed,theme:m.theme,sub:m.sub});MP.spec?mpHostBoard():mpBegin(MP.room);return}
 if(m.t==='lobby'){if(!MP)return;MP.room=m.room;MP.round=null;clearInterval(timer);S=null;mpLobby();return}
 if(m.t==='kicked'){if(MP){MP.left=true;try{MP.ws.close()}catch(e){}}MP=null;SSX.set(null);clearInterval(timer);S=null;menu();return}
 if(m.t==='err'){const had=MP&&MP.id;if(!had){try{MP&&MP.ws&&MP.ws.close()}catch(e){}MP=null;SSX.set(null)}const e=$('#merr');if(e)e.textContent=m.msg;else if(!had)menu();return}
}
function mpBegin(room){MP.round=room.round;clearInterval(timer);start(true,room.theme,room.seed,undefined,room.sub,true);mpSend({t:'progress',i:0,mi:0,late:0,sq:''})}
function boardRows(r,max){
 return r.players.slice(0,max).map((p,i)=>`<div class="brow${p.id===MP.id?' me':''}${p.online?'':' off'}"><span class="rk">${i+1}</span><span class="nm">${esc(p.name)}${p.id===MP.id?' (you)':''}</span><span class="pbar"><i style="width:${Math.round(100*p.mi/TOTAL)}%"></i></span><span class="mi">${p.mi} mi</span><span class="sq">${(p.sq||'').split('').map(c=>SQE[c]||'').join('')}${p.done?' ✓':''}</span></div>`).join('')||'<p class="mute">No players yet.</p>';
}
function mpRefresh(){
 const r=MP&&MP.room;if(!r)return;
 if($('#pl')){$('#pc').textContent='('+r.players.length+')';
  $('#pl').innerHTML=r.players.map(p=>`<li class="${p.online?'':'off'}">${p.host?'👑 ':''}${esc(p.name)}${p.id===MP.id?' (you)':''}${MP.host&&p.id!==MP.id?` <button class="chip lis" data-kick="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button>`:''}</li>`).join('')||'<li class="mute">Nobody yet…</li>';
  app.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>mpSend({t:'kick',id:b.dataset.kick}))}
 if($('#mb'))$('#mb').innerHTML=boardRows(r,5);
 if($('#fbd'))mpFinalDraw();
 if($('#hb'))mpHostDraw();
}
function mpTopic(r){return r.sub?SUBLABEL[r.sub]:(r.theme==='M'?'Mixed topics':TN[r.theme])}
function mpHostScreen(){
 const opts='<option value="M">🎲 Mixed topics</option>'+GROUPS.map(g=>`<optgroup label="${g.name}"><option value="${g.k}">All ${g.name.toLowerCase()}</option>${g.subs.filter(s=>s[0]!=='#').map(s=>`<option value="${s}">${SUBLABEL[s]}</option>`).join('')}</optgroup>`).join('');
 app.innerHTML=`<div class="section-kicker">🎮 Multiplayer</div><h1>Host a game</h1><div class="card"><label for="mt">Topic</label><select id="mt">${opts}</select><label for="mn2" style="display:block;margin-top:12px">Your name</label><input id="mn2" maxlength="24" value="${esc(store('cc_name')||'')}" placeholder="Teacher or player name"><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="mpl" checked style="width:auto;min-height:0"> I want to play too</label><p class="mute" id="merr" role="alert"></p><div class="row"><button class="main" id="mgo">Create room →</button><button id="mbk">Back</button></div></div>`;
 $('#mbk').onclick=menu;
 $('#mgo').onclick=()=>{const v=$('#mt').value,n=$('#mn2').value.trim(),sub=v.includes('-')?v:null,theme=sub?sub[0].toUpperCase():v;store('cc_name',n);$('#merr').textContent='Connecting…';mpOpen({t:'create',name:n,theme,sub,play:$('#mpl').checked})};
}
function mpJoinScreen(code){
 app.innerHTML=`<div class="section-kicker">🎮 Multiplayer</div><h1>Join a game</h1><div class="card"><label for="jc">Room code</label><input id="jc" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(code||'')}" style="text-transform:uppercase;letter-spacing:.3em;font-size:1.6rem;text-align:center"><label for="jn" style="display:block;margin-top:12px">Your name</label><input id="jn" maxlength="24" autocomplete="nickname" value="${esc(store('cc_name')||'')}"><p class="mute" id="merr" role="alert"></p><div class="row"><button class="main" id="jgo">Join →</button><button id="jbk">Back</button></div></div>`;
 $('#jbk').onclick=()=>{try{history.replaceState(null,'',location.pathname)}catch(e){}menu()};
 const go=()=>{const c=$('#jc').value.trim().toUpperCase(),n=$('#jn').value.trim();if(c.length!==4){$('#merr').textContent='Enter the 4-letter code.';return}if(!n){$('#merr').textContent='Type your name.';$('#jn').focus();return}store('cc_name',n);$('#merr').textContent='Connecting…';mpOpen({t:'join',code:c,name:n})};
 $('#jgo').onclick=go;$('#jn').onkeydown=e=>{if(e.key==='Enter')go()};
}
function mpLobby(){
 const r=MP.room,link=location.origin+location.pathname+'#room-'+r.code;
 app.innerHTML=`<div class="section-kicker">🎮 Room</div><h1>Code <span class="code">${esc(r.code)}</span></h1><p class="mute">Topic: ${esc(mpTopic(r))} · host: ${esc(r.hostName)}</p>
 <div class="card"><div class="lobby"><img src="/qr.svg?u=${encodeURIComponent(link)}" alt="QR code to join this room" width="180" height="180"><div><p><b>Scan the QR code</b>, or open the link and type the code.</p><p class="mute" style="word-break:break-all">${esc(link)}</p><button id="cp">Copy link</button></div></div></div>
 <div class="card"><h2>Players <span id="pc"></span></h2><ul class="plist" id="pl"></ul></div>
 <div class="row">${MP.host?'<button class="main" id="st">Start the game →</button>':'<p class="mute">Waiting for the host to start…</p>'}<button id="lv">Leave</button></div>`;
 $('#lv').onclick=mpLeave;
 $('#cp').onclick=()=>{try{navigator.clipboard.writeText(link);$('#cp').textContent='Copied!'}catch(e){}};
 if($('#st'))$('#st').onclick=()=>mpSend({t:'start'});
 mpRefresh();
}
function mpFinalDraw(){
 const r=MP.room,done=r.players.filter(p=>p.done).length;
 $('#fbd').innerHTML=`<h2>🏆 Leaderboard</h2><p class="mute">${done} of ${r.players.length} players finished${r.state==='done'?' · game over':''}</p>${boardRows(r,80)}${MP.host?`<div class="row" style="margin-top:12px"><button class="main" id="ag">Play again</button><button id="en">End game</button></div>`:''}<div class="row" style="margin-top:12px"><button id="lv2">Leave room</button></div>`;
 if($('#ag'))$('#ag').onclick=()=>mpSend({t:'again'});if($('#en'))$('#en').onclick=()=>mpSend({t:'end'});$('#lv2').onclick=mpLeave;
}
function mpFinish(){
 const st=stats(S.res);mpSend({t:'finish',mi:st.mi,late:st.late,sq:S.res.map(r=>r.c[0]).join('')});
 const rep=$('#rep');if(rep)rep.insertAdjacentHTML('beforebegin','<section class="card" id="fbd"></section>');mpFinalDraw();
}
function mpDoneScreen(){app.innerHTML='<div class="section-kicker">🎮 Multiplayer</div><h1>You have finished</h1><section class="card" id="fbd"></section>';mpFinalDraw()}
function mpHostBoard(){app.innerHTML='<div class="section-kicker">🎮 Live</div><h1>Game in progress</h1><section class="card" id="hb"></section>';mpHostDraw()}
function mpHostDraw(){
 const r=MP.room,done=r.players.filter(p=>p.done).length;
 $('#hb').innerHTML=`<p class="mute">Topic: ${esc(mpTopic(r))} · ${done} of ${r.players.length} finished${r.state==='done'?' · game over':''}</p>${boardRows(r,100)}<div class="row" style="margin-top:12px"><button class="main" id="ag">Play again</button><button id="en">End game</button><button id="lv2">Leave</button></div>`;
 $('#ag').onclick=()=>mpSend({t:'again'});$('#en').onclick=()=>mpSend({t:'end'});$('#lv2').onclick=mpLeave;
}
function route(){

 if(sv&&(!r||r[1]===sv.code)){MP=null;app.innerHTML='<p class="mute">Reconnecting to your game…</p>';mpOpen({t:'rejoin',code:sv.code,id:sv.id,token:sv.token});return}
 if(m)classJoin(m[1],m[2]);else if(r)mpJoinScreen(r[1]);else menu();
}
try{muted=localStorage.getItem('cc_mute')==='1'}catch(e){}
const BASE=location.href.split('#')[0],TN={G:'Grammar',V:'Vocabulary',E:'Everyday English',W:'World & numbers'},IC={G:'🧩',V:'📚',E:'🛒',W:'🌍',M:'🎲'};

];

'e-daily':'Time & routines','e-shop':'Shopping & money','e-food':'Restaurants & cafés','e-travel':'Travel & directions','e-social':'Polite phrases & phone calls','e-intro':'Greetings & introductions','e-health':'At the doctor’s','e-hotel':'At the hotel','e-plans':'Invitations & plans','e-opinion':'Opinions & agreeing','e-help':'Help & apologies','e-msg':'Emails & messages','e-class':'Classroom English',
'w-uk':'UK & English-speaking world','w-geo':'Countries & capitals','w-facts':'Numbers & facts','w-culture':'Festivals & traditions','w-nature':'Our planet','w-science':'Simple science','w-food':'Food around the world','w-sport':'Sport around the world','w-time':'Calendar & dates','w-money':'Money & measures','__wrong':'My mistakes'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
function pickQs(th,r,sub){let pool=Q.filter(q=>!th||th==='M'||q.th===th);if(sub)pool=sub==='__wrong'?wrongQs():Q.filter(q=>q.sub===sub);if(sub)return shuffle(pool,r).slice(0,7).map(q=>scrambleQuestion(q,r)).sort((a,b)=>({A1:0,A2:1,B1:2}[a.lv]-{A1:0,A2:1,B1:2}[b.lv]));const out=[];[['A1',2],['A2',3],['B1',2]].forEach(([l,n])=>out.push(...shuffle(pool.filter(q=>q.lv===l),r).slice(0,n).map(q=>scrambleQuestion(q,r))));if(out.length<7)out.push(...shuffle(pool.filter(q=>!out.includes(q)),r).slice(0,7-out.length).map(q=>scrambleQuestion(q,r)));const o={A1:0,A2:1,B1:2};return out.sort((a,b)=>o[a.lv]-o[b.lv])}
function dayTh(){const d=new Date();return 'GVEW'[Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%4]}
function yest(){const d=new Date(Date.now()-864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function streak(){try{const s=JSON.parse(store('cc_streak'));return s&&(s.last===today()||s.last===yest())?s.n:0}catch(e){return 0}}
function bumpStreak(){let s=null;try{s=JSON.parse(store('cc_streak'))}catch(e){}if(s&&s.last===today())return;store('cc_streak',JSON.stringify({last:today(),n:s&&s.last===yest()?s.n+1:1}))}
function menu(){
 let d=null;try{d=JSON.parse(store('cc_daily'))}catch(e){}
 const played=d&&d.date===today(),th=dayTh(),n=streak();
 const groups=GROUPS,P=prog(),WQ=wrongQs();
 const cards=groups.map(g=>{const count=Q.filter(q=>q.th===g.k).length;return `<section class="topic-card" data-topic="${g.k}"><div class="topic-head"><div class="topic-icon">${g.icon}</div><div><h3>${g.name}</h3><p>${g.desc} · ${count} questions</p></div></div><div class="subtopics">${g.subs.map(sub=>{if(sub[0]==='#')return `<div class="subhead">${sub.slice(1)}</div>`;const c=Q.filter(q=>q.sub===sub).length;return `<button class="subtopic" data-th="${g.k}" data-sub="${sub}"><span>${SUBLABEL[sub]}</span><span class="sub-count">${c} ${c===1?'Q':'Qs'}${P[sub]&&P[sub].n>=2?' · '+Math.round(100*P[sub].s/P[sub].n)+'%':''}</span></button>`}).join('')}</div><button class="topic-all" data-t="${g.k}">Practise all ${g.name.toLowerCase()} →</button></section>`}).join('');
 app.innerHTML=`<header class="masthead"><div class="eyebrow">All aboard · English practice</div><h1>Clickety-Clack</h1><p class="subtitle">A little practice. A longer journey. Build your English from A1 to B1.</p></header>
 <div class="card feature-card"><div class="feature-top"><div><div class="section-kicker">🚦 Today’s departure</div><h2>Daily challenge</h2><p>Today’s focus: <b>${IC[th]} ${TN[th]}</b>. Seven questions, one shared challenge.</p><p class="mute">${n?'🔥 '+n+(n>1?' days':' day')+' in a row':'Play today to start your streak.'}</p></div><div class="feature-emoji">🎟️</div></div><div class="row" style="margin-top:12px"><button class="main" id="dc">${played?'See today’s result':'Start today’s train'} →</button><button id="mix">🎲 Mixed practice</button></div></div>
 ${WQ.length?`<div class="card"><div class="section-kicker">🔁 Learn from mistakes</div><h2>Fix my mistakes</h2><p class="mute">${WQ.length} question${WQ.length>1?'s':''} to try again. Answer correctly to remove them from the list.</p><button class="main" id="fx">Practise my mistakes →</button></div>`:''}
 <div class="section-kicker">Choose your learning route</div><h2>Explore by topic</h2><p class="mute">Pick a whole subject or go straight to a smaller theme. Short topic rounds use the questions available in that theme.</p><div class="menu-grid">${cards}</div>
 <section class="card"><div class="section-kicker">🎮 Play together</div><h2>Multiplayer</h2><p class="mute">Create a room, share the QR code, and race on a live leaderboard.</p><div class="row"><button class="main" id="mph">Host a game</button><button id="mpj">Join with a code</button></div></section>
 <section class="card"><div class="section-kicker">👩‍🏫 For the classroom</div><h2>Class game</h2><p class="mute">Create a shared quiz link and QR code for your students.</p><label for="cs">Choose a topic</label><select id="cs" aria-label="Topic">${'GVEWM'.split('').map(k=>`<option value="${k}">${k==='M'?'🎲 Mixed topics':IC[k]+' '+TN[k]}</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="main" id="cg">Create class game →</button></div></section>
 <details class="card details-card"><summary>How to play</summary><ul><li>Daily and full-topic rounds have 7 questions, from A1 to B1.</li><li>Short theme rounds include the questions available for that theme.</li><li>Correct answers add miles and carriages; quick answers and streaks can earn bonuses.</li><li>London to Edinburgh is ${TOTAL} miles. Can you get the train all the way there?</li></ul></details>`;
 $('#dc').onclick=()=>{if(played){RM=d.meta||{name:store('cc_name')||'',mode:'Daily challenge',topic:'',date:d.date};result(d.res,true)}else{SFX.whistle();start(false,th)}};
 $('#mix').onclick=()=>{SFX.whistle();start(true,'M')};
 if($('#fx'))$('#fx').onclick=()=>{SFX.whistle();start(true,'M',undefined,undefined,'__wrong')};
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SFX.whistle();start(true,b.dataset.t)});
 app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{SFX.click();lessonScreen(b.dataset.sub,b.dataset.th)});

 $('#mph').onclick=mpHostScreen;$('#mpj').onclick=()=>mpJoinScreen('');
}
function drawBoard(code){let a=[];try{a=JSON.parse(store('cc_board_'+code))||[]}catch(e){}a.sort((x,y)=>y.m-x.m||x.l-y.l);$('#bd').innerHTML=a.length?`<ol>${a.map(x=>`<li><b>${esc(x.n)}</b> ${x.m} miles · ${x.l} min late ${esc(x.s)}</li>`).join('')}</ol>`:''}
function classHost(th){
 const code=[0,0,0,0].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''),link=BASE+'#class-'+code+'-'+th;
 app.innerHTML=`<h1>Class game</h1><p class='mute'>Topic: ${th==='M'?'Mixed topics':TN[th]} · code <b>${code}</b></p><div class='card'><p>Students scan this QR code, type their name and play the same 7 questions.</p><div id='qr' style='background:#fff;padding:10px;width:fit-content;margin:8px auto'></div><p class='mute' style='word-break:break-all'>${link}</p><div class='row'><button class='main' id='play'>Play too</button><button id='mn'>Menu</button></div></div><div class='card'><h2>Class board</h2><p class='mute'>Each student taps “Copy line” at the end and sends it to you. Paste the lines here.</p><textarea id='ta' rows='3' aria-label='Results'></textarea><div class='row' style='margin-top:8px'><button id='add'>Add to board</button></div><div id='bd'></div></div>`;
 $('#qr').innerHTML='<img src="/qr.svg?u='+encodeURIComponent(link)+'" alt="QR code" width="200" height="200">'
 $('#play').onclick=()=>classJoin(code,th);$('#mn').onclick=menu;
 $('#add').onclick=()=>{let a=[];try{a=JSON.parse(store('cc_board_'+code))||[]}catch(e){}$('#ta').value.split('\n').forEach(l=>{const p=l.split('|').map(s=>s.trim());if(p.length>=3&&p[0]&&Number.isFinite(Number(p[1]))&&Number(p[1])>=0&&Number.isFinite(Number(p[2]||0))&&Number(p[2]||0)>=0){a=a.filter(x=>x.n!==p[0].slice(0,24));a.push({n:p[0].slice(0,24),m:Math.round(Number(p[1])),l:Math.round(Number(p[2]||0)),s:(p[3]||'').slice(0,12)})}});store('cc_board_'+code,JSON.stringify(a));$('#ta').value='';drawBoard(code)};
 drawBoard(code);
}
function classJoin(code,th){
 app.innerHTML=`<h1>Class game</h1><p class='mute'>Topic: ${th==='M'?'Mixed topics':TN[th]} · code ${code}</p><div class='card'><label for='nm'>Your name</label><input id='nm' maxlength='24' autocomplete='nickname' value='${esc(store('cc_name')||'')}'><div class='row' style='margin-top:12px'><button class='main' id='go'>Start</button></div></div>`;

function clsDone(){
 const res=S.res,mi=Math.min(TOTAL,res.reduce((a,x)=>a+x.mi,0)),late=res.reduce((a,x)=>a+x.delay,0),line=S.cls.n.replace(/\|/g,'/')+' | '+mi+' | '+late+' | '+res.map(r=>r.c==='good'?'🟩':r.c==='mid'?'🟨':'⬛').join('');
 app.insertAdjacentHTML('beforeend',`<div class='card'><h2>Class ${S.cls.code}</h2><p>Send this line to your teacher:</p><p><b>${esc(line)}</b></p><button id='cl'>Copy line</button></div>`);
 $('#cl').onclick=()=>{try{navigator.clipboard.writeText(line)}catch(e){}$('#cl').textContent='Copied!'};
}
initSnd();route();
</script>
</body>
